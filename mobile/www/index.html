<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GlobeSIM</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: 28px; text-align: center;
        background: #f6f3ee; color: #111a1f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .box { max-width: 420px; width: 100%; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 20px;
        border-radius: 16px; background: #0b3c49;
        display: flex; align-items: center; justify-content: center;
      }
      .mark svg { width: 30px; height: 30px; }
      h1 { font-size: 20px; line-height: 1.35; margin: 0 0 10px; }
      p { font-size: 15px; line-height: 1.55; color: #5b666c; margin: 0 0 24px; }
      a.btn {
        display: inline-block; min-height: 48px; line-height: 48px; padding: 0 26px;
        border-radius: 14px; background: #0b3c49; color: #fff;
        font-size: 16px; font-weight: 600; text-decoration: none;
      }
      a.btn:active { background: #082d37; }
      .hint { margin-top: 16px; font-size: 13px; color: #5b666c; }
      #saved { margin-top: 32px; text-align: left; }
      #saved h2 { font-size: 17px; margin: 0 0 4px; text-align: center; }
      #saved .note { font-size: 13px; text-align: center; margin: 0 0 14px; }
      .card { background: #fff; border: 1px solid #e3ddd3; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
      .card h3 { font-size: 16px; margin: 0 0 10px; }
      .card img { display: block; width: 220px; max-width: 100%; margin: 0 auto 12px; }
      .card dt { font-size: 12px; color: #5b666c; margin-top: 8px; }
      .card dd { margin: 2px 0 0; font-size: 13px; word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .card button.primary { background: #0b3c49; color: #fff; display: block; width: 100%; min-height: 48px; margin: 0 0 6px; }
      .card button { margin-top: 8px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #0b3c49; background: #fff; color: #0b3c49; font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2bd9a0" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M3.5 12h17M12 3.5c2.6 2.4 2.6 14.6 0 17M12 3.5c-2.6 2.4-2.6 14.6 0 17" />
        </svg>
      </div>
      <h1>Keine Verbindung</h1>
      <p>
        GlobeSIM braucht Internet, damit du Tarife sehen und deine eSIM öffnen kannst.
        Prüfe WLAN oder mobile Daten und versuche es erneut.
      </p>
      <a class="btn" href="https://globesim.de">Erneut versuchen</a>
      <div class="hint">Bist du unterwegs? Deine gekauften eSIMs findest du auch in der E-Mail zur Bestellung.</div>
      <section id="saved" hidden>
        <h2>Deine gespeicherten eSIMs</h2>
        <p class="note" id="savedNote"></p>
        <div id="list"></div>
      </section>
    </div>
    <script>
      // Offline-Kopie der eSIMs (Android-App, verschlüsselt auf dem Gerät gespeichert).
      // Texte nur über textContent, QR-Codes nur als Bild: gespeicherte Inhalte laufen nie als Code.
      (function () {
        var cap = window.Capacitor;
        if (!cap || !cap.nativePromise) return;
        cap.nativePromise("GlobeSimApp", "loadOffline", {}).then(function (r) {
          var snap = null;
          try { snap = r && r.snapshot ? JSON.parse(r.snapshot) : null; } catch (e) { snap = null; }
          if (!snap || snap.v !== 1 || !Array.isArray(snap.esims) || !snap.esims.length) return;
          var list = document.getElementById("list");
          var saved = new Date(snap.savedAt);
          document.getElementById("savedNote").textContent =
            "Gespeichert am " + (isNaN(saved) ? "" : saved.toLocaleDateString("de-DE")) +
            ". Zum Installieren brauchst du kurz WLAN oder mobile Daten.";
          snap.esims.forEach(function (e) {
            if (typeof e.qrSvg !== "string" || e.qrSvg.indexOf("<svg") !== 0) return;
            var card = document.createElement("div"); card.className = "card";
            var h = document.createElement("h3"); h.textContent = String(e.title || "eSIM"); card.appendChild(h);
            var img = document.createElement("img"); img.alt = "QR-Code zur eSIM-Installation";
            img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(e.qrSvg); card.appendChild(img);
            var dl = document.createElement("dl");
            [["SM-DP+-Adresse", e.smdp], ["Aktivierungscode", e.activationCode], ["LPA", e.lpa]].forEach(function (row) {
              if (!row[1]) return;
              var dt = document.createElement("dt"); dt.textContent = row[0];
              var dd = document.createElement("dd"); dd.textContent = String(row[1]);
              dl.appendChild(dt); dl.appendChild(dd);
            });
            card.appendChild(dl);
            if (e.lpa) {
              var ib = document.createElement("button"); ib.type = "button"; ib.className = "primary"; ib.textContent = "Jetzt installieren";
              ib.addEventListener("click", function () {
                cap.nativePromise("GlobeSimApp", "openEsimInstall", { lpa: String(e.lpa) }).catch(function () {
                  ib.textContent = "Nicht möglich: bitte QR-Code scannen";
                });
              });
              card.appendChild(ib);
            }
            if (e.lpa && navigator.clipboard) {
              var b = document.createElement("button"); b.type = "button"; b.textContent = "LPA kopieren";
              b.addEventListener("click", function () {
                navigator.clipboard.writeText(String(e.lpa)).then(function () { b.textContent = "Kopiert"; });
              });
              card.appendChild(b);
            }
            list.appendChild(card);
          });
          if (list.children.length) document.getElementById("saved").hidden = false;
        }).catch(function () {});
      })();
    </script>
  </body>
</html>
