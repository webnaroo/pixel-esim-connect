name: Android App Bundle

# Baut die signierte App-Datei (.aab) für Google Play.
# Start: automatisch bei Änderungen an mobile/ auf dem Arbeitszweig, oder von Hand
# (GitHub → Actions → "Android App Bundle" → Run workflow; der Knopf erscheint erst, wenn die Datei auf main liegt).
on:
  push:
    branches: [claude/lovable-data-export-4pljrj]
    paths: ["mobile/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (bei jedem Play-Upload um 1 erhöhen)"
        required: true
        default: "1"
      version_name:
        description: "versionName"
        required: true
        default: "1.0"

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Das Android SDK ist auf den GitHub-Rechnern schon installiert; nur die Lizenzen bestätigen.
      - name: Android-Lizenzen bestätigen
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npx cap sync android
      - name: Firebase-Datei für Push-Mitteilungen schreiben (optional)
        env:
          GSJ_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ_B64" ]; then echo "$GSJ_B64" | base64 -d > android/app/google-services.json; else echo "Kein google-services.json: App wird ohne Push gebaut"; fi
      - name: Schlüssel aus den Secrets schreiben
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/globesim-release.jks"
      - name: Bundle bauen
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/globesim-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: ./gradlew bundleRelease assembleRelease -PversionCode=${{ inputs.version_code || '1' }} -PversionName=${{ inputs.version_name || '1.0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: globesim-release
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
