name: Android App Bundle

# Baut die signierte App-Datei (.aab) für Google Play. Start von Hand:
# GitHub → Actions → "Android App Bundle" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (bei jedem Play-Upload um 1 erhöhen)"
        required: true
        default: "1"
      version_name:
        description: "versionName"
        required: true
        default: "1.0"

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - name: Schlüssel aus den Secrets schreiben
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/globesim-release.jks"
      - name: Bundle bauen
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/globesim-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: ./gradlew bundleRelease -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: globesim-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
